name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 默认只读，创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm ci

      - name: 生成 Android 项目
        working-directory: ./frontend
        run: npx expo prebuild -p android --no-install

      - name: 强制更新应用图标
        working-directory: ./frontend
        run: |
          # prebuild 可能使用缓存的旧图标，强制用 src/assets 中的新图标覆盖
          for dir in android/app/src/main/res/mipmap-*; do
            cp src/assets/icon.png "$dir/ic_launcher.webp"
            cp src/assets/adaptive-icon.png "$dir/ic_launcher_foreground.webp"
            cp src/assets/icon.png "$dir/ic_launcher_round.webp"
          done
          echo "图标更新完成"

      - name: 构建 APK
        working-directory: ./frontend/android
        # 只编 arm64-v8a（现代手机都是这个架构），C++ 编译量减到 1/4
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: maozi-study-cook-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 帽子学做饭 v${{ github.run_number }}
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
