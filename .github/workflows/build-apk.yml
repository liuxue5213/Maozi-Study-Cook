name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==================== 构建 APK ====================
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm ci

      - name: 生成 Android 项目
        working-directory: ./frontend
        run: npx expo prebuild -p android --no-install

      - name: 构建 APK
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 重命名并上传 APK
        run: |
          cd frontend/android/app/build/outputs/apk/release
          mv app-release-unsigned.apk maozi-study-cook.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: maozi-study-cook-apk
          path: frontend/android/app/build/outputs/apk/release/maozi-study-cook.apk
          retention-days: 30

      - name: 创建 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 帽子学做饭 v${{ github.run_number }}
          files: frontend/android/app/build/outputs/apk/release/maozi-study-cook.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 部署后端到服务器 ====================
  deploy-backend:
    name: 部署后端到服务器
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 开始部署后端..."

            cd /var/www/Maozi-Study-Cook/backend

            # 拉取最新代码
            git pull origin main

            # 安装依赖
            npm ci --production

            # 重启 PM2 进程
            pm2 restart maozi-api --update-env || pm2 start dist/main.js --name maozi-api

            # 重启 Nginx
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ 部署完成！"
