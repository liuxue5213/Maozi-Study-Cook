name: CI / Build / Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==================== 1. CI 检查 ====================
  ci:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: 前端 Lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

      - name: 后端 Lint
        working-directory: ./backend
        run: |
          npm ci
          npm run lint

  # ==================== 2. 构建 APK ====================
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm ci

      - name: 生成 Android 项目
        working-directory: ./frontend
        run: npx expo prebuild -p android --no-install

      - name: 构建 APK
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: maozi-study-cook-apk
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  # ==================== 3. 部署到服务器 ====================
  deploy:
    name: 部署服务器
    runs-on: ubuntu-latest
    needs: [ci, build-apk]

    steps:
      - uses: actions/checkout@v4

      - name: 部署后端 + 前端 Web
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始部署..."

            # 首次运行：克隆仓库
            if [ ! -d "/var/www/Maozi-Study-Cook" ]; then
              echo "📥 克隆仓库..."
              git clone https://github.com/liuxue5213/Maozi-Study-Cook.git /var/www/Maozi-Study-Cook
            fi

            cd /var/www/Maozi-Study-Cook

            # 拉取最新代码
            git fetch origin main
            git reset --hard origin/main

            # 后端
            echo "📦 构建后端..."
            cd backend
            npm ci
            npx prisma migrate deploy 2>/dev/null || echo "  ⚠️  迁移跳过"
            node_modules/.bin/nest build
            pm2 restart maozi-api --update-env || pm2 start dist/src/main.js --name maozi-api
            cd ..

            # 前端 Web
            echo "📦 构建前端 Web..."
            cd frontend
            npm ci
            npm run build:web
            sudo cp -r dist/* /var/www/html/
            cd ..

            # Nginx
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ 部署完成！"
