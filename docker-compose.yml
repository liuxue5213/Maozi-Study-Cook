# 帽子学做饭 - Docker Compose 编排配置
# 注意：当前服务器未安装 Docker，此配置预留用于后续迁移
# 部署命令: docker-compose up -d

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: maozi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-maozi_root_password}
      MYSQL_DATABASE: maozi_cook
      MYSQL_USER: ${DB_USER:-maozi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-maozi_password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - maozi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: maozi-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-maozi_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - maozi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maozi-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 60135
      DATABASE_URL: mysql://${DB_USER:-maozi}:${DB_PASSWORD:-maozi_password}@mysql:3306/maozi_cook
      REDIS_URL: redis://:${REDIS_PASSWORD:-maozi_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen-vl-plus}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-qwen-plus}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "60135:60135"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maozi-network

  # 前端 Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maozi-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - maozi-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  maozi-network:
    driver: bridge
