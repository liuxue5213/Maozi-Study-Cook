# ============================================
# 麦子学厨 - Nginx 配置
# 服务器: 120.48.13.152
# ============================================

# 上游后端服务
upstream maozi_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP 重定向到 HTTPS（配置 SSL 后取消注释）
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name your-domain.com 120.48.13.152;

    # 日志
    access_log /var/log/nginx/maozi_access.log;
    error_log /var/log/nginx/maozi_error.log;

    # 客户端最大上传大小
    client_max_body_size 20M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ==================== API 代理 ====================
    location /api/ {
        proxy_pass http://maozi_backend;
        proxy_http_version 1.1;

        # 请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 禁用缓存
        proxy_cache_bypass $http_upgrade;
    }

    # ==================== Swagger 文档 ====================
    location /api/docs {
        proxy_pass http://maozi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==================== 上传文件 ====================
    location /uploads/ {
        alias /var/www/Maozi-Study-Cook/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # 只允许图片
        location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    # ==================== 前端静态文件 ====================
    location / {
        root /var/www/html;
        index index.html;

        # SPA 路由支持
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # HTML 不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ==================== 安全头 ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

